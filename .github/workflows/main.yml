name: Restore SQL Server Database from Backup

on:
  workflow_dispatch:


env:
  DB_PWD: Redg@te1
  DB_NAME: SSC
  BACKUP_DIR: SQLBKP

jobs:
  restore-db:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ env.DB_PWD }}
        ports:
        - 1433:1433
        options: >-
          --health-cmd "exit 0" --health-interval 10s --health-timeout 5s --health-retries 10
        volumes:
        - ${{ github.workspace }}/SQLBKP:/var/opt/mssql/backups

    steps:
    - name: Checkout master branch
      uses: actions/checkout@v4
      with:
        ref: master

    - name: Wait for SQL Server to be ready
      run: sleep 20

    - name: Get logical file names from backup
      run: |
        /opt/mssql-tools/bin/sqlcmd -S localhost -U $DB_USER -P $DB_PWD -Q "RESTORE FILELISTONLY FROM DISK = N'/var/opt/mssql/backups/SSC.bak'"

    - name: Restore database
      run: |
        /opt/mssql-tools/bin/sqlcmd -S localhost -U $DB_USER -P $DB_PWD -Q "
          RESTORE DATABASE [$DB_NAME] FROM DISK = N'/var/opt/mssql/backups/SSC.bak'
          WITH MOVE 'LogicalDataFileName' TO '/var/opt/mssql/data/$DB_NAME.mdf',
               MOVE 'LogicalLogFileName' TO '/var/opt/mssql/data/${DB_NAME}_log.ldf',
               REPLACE;
        "

name: Test SQL Server Locally

on:
  push:
    branches: [ main ]

env:
  DB_USER: sa
  DB_PWD: Redg@te1
  DB_HOST: localhost
  DB_PORT: 1433

jobs:
  test-db:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ env.DB_PWD }}
        ports:
        - 1433:1433
        options: >-
          --health-cmd "exit 0" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Wait for SQL Server to be ready
      run: sleep 20

    - name: Set DB connection string
      run: |
        echo "DB_URL=jdbc:sqlserver://${{ env.DB_HOST }}:${{ env.DB_PORT }};user=${{ env.DB_USER }};password=${{ env.DB_PWD }};" >> $GITHUB_ENV

    - name: Print DB connection string
      run: |
        echo "Connection string: $DB_URL"

name: Flyway Info Against Azure SQL Managed Instance

on:
  push:
    branches:
    - master

env:
  FLYWAY_IMAGE: redgate/flyway:latest

jobs:
  flyway-info:
    runs-on: ubuntu-latest
    name: Run Flyway Info with Config and Script Mounts

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: List repository contents
      run: ls -la "${{ github.workspace }}"

    - name: Create reports directory
      run: mkdir -p "${{ github.workspace }}/reports"

    - name: Run Flyway Info
      run: |
        docker run --rm \
          -v "${{ github.workspace }}/migrations:/flyway/sql" \
          -v "${{ github.workspace }}:/flyway/conf:ro" \
          -v "${{ github.workspace }}/reports:/flyway/reports" \
          ${FLYWAY_IMAGE} info

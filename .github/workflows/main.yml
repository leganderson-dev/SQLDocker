name: Flyway Info Against Azure SQL Managed Instance

on:
  push:
    branches:
    - master

env:
  FLYWAY_URL: jdbc:sqlserver://andersonmanagedinstance.public.a1e629225940.database.windows.net:3342;databaseName=SSC_Prod;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net
  FLYWAY_USER: redgate
  FLYWAY_PASSWORD: Redg@te123456789

jobs:
  flyway-info:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Flyway Info
      run: |
        docker run --rm \
          -e FLYWAY_URL="${FLYWAY_URL}" \
          -e FLYWAY_USER="${FLYWAY_USER}" \
          -e FLYWAY_PASSWORD="${FLYWAY_PASSWORD}" \
          info

name: Restore SQL Server Database from Backup

on:
  push:
    branches:
    - master

env:
  DB_USER: sa
  DB_PWD: Redg@te1
  DB_NAME: SSC

jobs:
  restore-db:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: ${{ env.DB_PWD }}
        ports:
        - 1433:1433
        options: >-
          --health-cmd "exit 0" --health-interval 10s --health-timeout 5s --health-retries 10
        volumes:
        - ${{ github.workspace }}/SQLBKP:/var/opt/mssql/backups

    steps:
    - name: Checkout master branch
      uses: actions/checkout@v4
      with:
        ref: master

    - name: Wait for SQL Server to start
      run: sleep 25

    - name: Install sqlcmd tools
      run: |
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18 unixodbc-dev
        echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

    - name: Get logical file names from backup
      run: |
        sqlcmd -S "localhost;Encrypt=no" -U $DB_USER -P $DB_PWD -Q "RESTORE FILELISTONLY FROM DISK = N'/var/opt/mssql/backups/SSC.bak'"

    # IMPORTANT: Update the logical file names below after checking the output of the previous step!
    - name: Restore database
      run: |
        sqlcmd -S "localhost;Encrypt=no" -U $DB_USER -P $DB_PWD -Q "
          RESTORE DATABASE [$DB_NAME] FROM DISK = N'/var/opt/mssql/backups/SSC.bak'
          WITH MOVE 'LogicalDataFileName' TO '/var/opt/mssql/data/$DB_NAME.mdf',
               MOVE 'LogicalLogFileName' TO '/var/opt/mssql/data/${DB_NAME}_log.ldf',
               REPLACE;
        "
